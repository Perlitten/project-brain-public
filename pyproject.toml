[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-brain"
version = "0.9.2"
description = "Project Brain core foundation services and utilities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Perlitten" }]
keywords = ["mcp", "code-search", "rag", "developer-tools", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "typer",
    "pydantic>=2.0.0",
    "pydantic-settings",
    # asyncio extras pull in greenlet — required by brain.database.session,
    # which is imported by the CLI entrypoint.
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg",
    "aiosqlite>=0.21,<1",
    "redis>=4.2.0",
    "neo4j",
    "loguru",
    "pyyaml",
    "httpx",
    # Native MCPServer and middleware API; keep the reviewed SDK contract pinned.
    "mcp==2.3.0",
    "pgvector",
    "cryptography>=50.0.2",
    "numpy>=2.2.6,<3",
]

[project.urls]
Homepage = "https://github.com/Perlitten/project-brain-public"
Issues = "https://github.com/Perlitten/project-brain-public/issues"
Changelog = "https://github.com/Perlitten/project-brain-public/blob/main/CHANGELOG.md"
Security = "https://github.com/Perlitten/project-brain-public/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "playwright",
    # eval benchmarks report real token counts, not chars/4 estimates.
    "tiktoken",
]
late-interaction-gpu = [
    "pylate==1.6.0",
]
gpu = [
    "pylate>=1.6.0,<2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "I001"]

[tool.ruff.lint.per-file-ignores]
# eval/ contains standalone local tooling that can set sys.path before importing
# the package (E402) and keep scratch locals (F841) - not shipped runtime code.
"eval/**" = ["E402", "F841"]
# tests bootstrap settings/fixtures before importing app modules.
"tests/**" = ["E402"]
# scripts/ set sys.path before importing the brain package.
"scripts/**" = ["E402"]

[project.scripts]
brain = "apps.cli.entrypoint:main"
brain-mcp = "apps.cli.entrypoint:mcp_main"

[tool.hatch.build.targets.wheel]
packages = ["brain", "apps"]
# A wheel may be built after the separate web app. Never ship its generated
# cache, npm dependencies, or local credentials with the Python runtime.
exclude = ["**/.brain/**", "/apps/web/**", "**/__pycache__/**", "**/*.pyc", "**/.next/**", "**/node_modules/**", "**/*.tsbuildinfo", "**/.env", "**/.env.*", "**/.deploy.env"]

[tool.hatch.build.targets.wheel.force-include]
"docs/legal/THIRD_PARTY_NOTICES.md" = "brain/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
# Source archives need the same protection as wheels, including when built
# after frontend development or from an unpacked source distribution.
exclude = ["**/.brain/**", "**/__pycache__/**", "**/*.pyc", "**/.vercel/**", "**/.next/**", "**/node_modules/**", "**/*.tsbuildinfo", "**/.env", "**/.env.*", "**/.deploy.env", "**/.npmrc", "**/.venv/**", "**/.git/**", "/reports/**", "/context_packs/**", "!**/.env*.example"]

[tool.mypy]
# 3.12 required: numpy's shipped stubs use the PEP 695 `type` statement, which
# mypy rejects under an older --python-version target. CI and the locked
# production runtime both use Python 3.12.
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = false
# SQLAlchemy 2.x models type natively via Mapped[...]; the old
# sqlalchemy.ext.mypy.plugin was removed upstream and breaks mypy startup.

# Missing stubs are tolerated only for these third-party packages. Internal
# modules (brain.*, apps.*) are NOT covered, so a typo'd internal import fails.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "torch", "torch.*", "pylate", "pylate.*"]
ignore_missing_imports = true

# scripts/v050_release_candidate.py imports its sibling script via sys.path.
[[tool.mypy.overrides]]
module = ["v050_engineering_lab_verification"]
ignore_missing_imports = true

# Project-wide mutation campaign: no coverage-only filter or stack-depth cutoff.
[tool.mutmut]
source_paths = ["brain", "apps/api", "apps/mcp_server", "apps/cli", "apps/__init__.py", "scripts"]
also_copy = ["README.md", "CLAUDE.md", "CHANGELOG.md", "SECURITY.md", ".env.example", ".mcp.json", ".dockerignore", ".gitattributes", "docs", "eval", "rules", "benchmarks", "examples", "apps/web", ".github", ".git", ".gitignore", "LICENSE", "requirements.lock", "requirements-dev.lock", "requirements-windows.lock", "docker-compose.yml", "docker-compose.quickstart.yml", "docker-compose.experimental-images.yml", "Dockerfile", "Makefile", "deploy", "migrations", "pytest.ini", "alembic.ini"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = false
max_stack_depth = -1
process_isolation = "forkserver"
forkserver_warmup = "collect"
use_setproctitle = false
timeout_multiplier = 3.0
timeout_constant = 2.0
log_to_file = true
