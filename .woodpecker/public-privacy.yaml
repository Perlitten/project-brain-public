when:
- event:
  - push
  - pull_request
  branch:
  - main
  - master
- event: manual
  branch:
  - main
  - master
  evaluate: PIPELINE_TASK != "benchmark" && PIPELINE_TASK != "codeql" && PIPELINE_TASK != "team-e2e" && PIPELINE_TASK != "lock-update"
clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      partial: false
steps:
- name: public-privacy
  image: python:3.12-bookworm
  commands:
  - python scripts/check_public_privacy.py --allow-github-identities
  - python scripts/check_public_launch.py
