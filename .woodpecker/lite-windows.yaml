when:
- event:
  - push
  - pull_request
  branch:
  - main
  - master
- event: manual
  branch:
  - main
  - master
  evaluate: PIPELINE_TASK != "benchmark" && PIPELINE_TASK != "codeql" && PIPELINE_TASK != "team-e2e" && PIPELINE_TASK != "lock-update"
labels:
  platform: windows/amd64
  backend: local
steps:
- name: checkout
  image: powershell
  commands:
  - if ($env:BRAIN_CI_WINDOWS_PATH) { $env:Path = $env:BRAIN_CI_WINDOWS_PATH }
  - if ($env:CI_COMMIT_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid commit SHA' }
  # Windows Lite does not consume Git history. Use GitHub's immutable source
  # archive so AppContainer need not inspect directories above its workspace.
  - |
    python -c @'
    import io, os, pathlib, re, stat, urllib.request, zipfile
    revision = os.environ['CI_COMMIT_SHA']
    assert re.fullmatch(r'[0-9a-f]{40}', revision), 'Invalid commit SHA'
    repository = os.environ['CI_REPO']
    assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository), 'Invalid repository'
    prefix = repository.rsplit('/', 1)[1] + '-' + revision + '/'
    url = 'https://codeload.github.com/' + repository + '/zip/' + revision
    with urllib.request.urlopen(url, timeout=120) as response:
        archive = zipfile.ZipFile(io.BytesIO(response.read()))
    assert archive.testzip() is None, 'Corrupt source archive'
    entries = archive.infolist()
    assert entries, 'Empty source archive'
    for entry in entries:
        assert entry.filename.startswith(prefix), 'Unexpected source revision'
        relative = pathlib.PurePosixPath(entry.filename[len(prefix):])
        assert not relative.is_absolute() and '..' not in relative.parts, 'Unsafe archive path'
        assert not stat.S_ISLNK(entry.external_attr >> 16), 'Unexpected source symlink'
    for entry in entries:
        relative = pathlib.PurePosixPath(entry.filename[len(prefix):])
        target = pathlib.Path(*relative.parts)
        if entry.is_dir():
            target.mkdir(parents=True, exist_ok=True)
        else:
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(archive.read(entry))
    print('Checked out immutable source archive at ' + revision)
    '@
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
- name: lite-windows
  image: powershell
  commands:
  - if ($env:BRAIN_CI_WINDOWS_PATH) { $env:Path = $env:BRAIN_CI_WINDOWS_PATH }
  - python -m venv .venv; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  - $env:Path = "$(Get-Location)\.venv\Scripts;$env:Path"
  - python scripts/run_lite_ci.py --install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  - python scripts/run_lite_ci.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  - python -m pytest tests/test_team_memory_load_e2e.py -q; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
skip_clone: true
