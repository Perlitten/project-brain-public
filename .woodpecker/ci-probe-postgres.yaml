when:
- event: manual
  evaluate: PIPELINE_TASK == "team-postgres-probe"
clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      partial: false
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: brain_db
  redis:
    image: redis:7-alpine
    environment: {}
  neo4j:
    image: neo4j:5.12-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 64m
steps:
- name: test
  image: python:3.12-bookworm
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres_password
    POSTGRES_DB: brain_db
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: neo4j_password
    DEFAULT_LLM_PROVIDER: mock
    DEFAULT_EMBEDDING_PROVIDER: mock
    TARGET_REPO_PATH: .
    REPO_ROOT: .
    BRAIN_CI_REQUIRE_SERVICES: '1'
  commands:
  - bash scripts/ci/bootstrap.sh
  - apt-get install -y --no-install-recommends socat
  - git config --global --add safe.directory "$${CI_WORKSPACE}"
  - "set -eu\nsocat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 &\nproxy_pid=$$!\ntrap 'kill \"$$proxy_pid\" 2>/dev/null || true' EXIT\nexport POSTGRES_HOST=127.0.0.1\npython scripts/ci/wait_services.py\n# Team authority PostgreSQL race, native MCP and restore checks\nPGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$POSTGRES_HOST\" -p \"$$POSTGRES_PORT\" -U \"$$POSTGRES_USER\" -d postgres -v ON_ERROR_STOP=1 \\\n  -c \"CREATE USER fixture WITH CREATEDB PASSWORD 'fixture_local_only'\" \\\n  -c \"CREATE DATABASE brain_team_test OWNER fixture\"\nTEST_TEAM_POSTGRES_URL=\"postgresql+asyncpg://fixture:fixture_local_only@$${POSTGRES_HOST}:$$POSTGRES_PORT/brain_team_test\" \\\n  pytest tests/test_team_foundations.py tests/test_team_transport.py tests/test_team_restore.py \\\n  tests/test_team_invitations.py tests/test_team_restore_fence.py tests/test_team_execution.py \\\n  tests/test_team_lock_order.py tests/test_team_execution_llm_artifacts.py tests/test_memory_cas_concurrency.py\
    \ -q\n# Keep the untrusted vector extension out of the restricted-role restore fixture's dump.\n# Only the following memory-lock regressions require it.\nPGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$POSTGRES_HOST\" -p \"$$POSTGRES_PORT\" -U \"$$POSTGRES_USER\" -d brain_team_test -v ON_ERROR_STOP=1 \\\n  -c \"CREATE EXTENSION IF NOT EXISTS vector\"\nTEST_TEAM_POSTGRES_URL=\"postgresql+asyncpg://fixture:fixture_local_only@$${POSTGRES_HOST}:$$POSTGRES_PORT/brain_team_test\" \\\n  pytest tests/test_team_locking_postgres.py -q\n\n\n\n"
labels:
  backend: docker
  capability: linux
