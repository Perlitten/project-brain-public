when:
- event: cron
  cron: benchmark
- event: deployment
  evaluate: CI_PIPELINE_DEPLOY_TASK == "benchmark"
- event: manual
  evaluate: PIPELINE_TASK == "benchmark"
clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      partial: false
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: brain_db
  redis:
    image: redis:7-alpine
    environment: {}
  neo4j:
    image: neo4j:5.12-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 64m
steps:
- name: benchmark
  image: python:3.12-bookworm
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres_password
    POSTGRES_DB: brain_db
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: neo4j_password
    DEFAULT_LLM_PROVIDER: mock
    DEFAULT_EMBEDDING_PROVIDER: mock
    TARGET_REPO_PATH: .
    REPO_ROOT: .
    BRAIN_CI_REQUIRE_SERVICES: '1'
    EMBEDDING_DIMENSION: '1536'
    PROJECT_BRAIN_API_KEY: ci-benchmark-ephemeral-key
  commands:
  - bash scripts/ci/bootstrap.sh
  - git config --global --add safe.directory "$${CI_WORKSPACE}"
  - bash scripts/ci/benchmark.sh
- name: artifacts
  image: woodpeckerci/plugin-s3@sha256:bf0a088e66b991803e3b9b0401f616245c4d736674195204a7e9e343a871a9ea
  settings:
    bucket:
      from_secret: ci_artifact_bucket
    endpoint:
      from_secret: ci_artifact_endpoint
    access_key:
      from_secret: ci_artifact_access_key
    secret_key:
      from_secret: ci_artifact_secret_key
    source: eval/harness_benchmark/results/*.json
    target: benchmark/${CI_PIPELINE_NUMBER}
    path_style: true
    acl: private
    region: us-east-1
  when:
  - status:
    - success
    - failure
