when:
- event:
  - push
  - pull_request
  branch:
  - main
  - master
- event: manual
  branch:
  - main
  - master
clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
      partial: false
steps:
- name: lite
  image: python:3.12-bookworm
  commands:
  - bash scripts/ci/bootstrap.sh
  - python scripts/run_lite_ci.py
  - python -m pytest tests/test_team_memory_load_e2e.py -q
