when:
- event:
  - push
  - pull_request
  branch:
  - main
  - master
- event: manual
  branch:
  - main
  - master
clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 0
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: brain_db
  redis:
    image: redis:7-alpine
    environment: {}
  neo4j:
    image: neo4j:5.12-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 64m
steps:
- name: test
  image: python:3.12-bookworm
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres_password
    POSTGRES_DB: brain_db
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: neo4j_password
    DEFAULT_LLM_PROVIDER: mock
    DEFAULT_EMBEDDING_PROVIDER: mock
    TARGET_REPO_PATH: .
    REPO_ROOT: .
    BRAIN_CI_REQUIRE_SERVICES: '1'
  commands:
  - bash scripts/ci/bootstrap.sh
  - bash scripts/ci/test.sh
- name: artifacts
  image: woodpeckerci/plugin-s3
  settings:
    bucket:
      from_secret: ci_artifact_bucket
    endpoint:
      from_secret: ci_artifact_endpoint
    access_key:
      from_secret: ci_artifact_access_key
    secret_key:
      from_secret: ci_artifact_secret_key
    source: coverage.xml
    target: /project-brain/${CI_PIPELINE_NUMBER}/test
    acl: private
    path_style: true
  when:
  - status:
    - success
    - failure
