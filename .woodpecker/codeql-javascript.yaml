when:
- event:
  - push
  - pull_request
  branch:
  - main
  - master
- event: cron
  cron: codeql
- event: manual
  evaluate: PIPELINE_TASK == "codeql"
steps:
- name: checkout
  image: localhost/woodpecker-codeql@sha256:55926369f574f467df1435391e5995addf658bda06ff1eb9c5722676cef54209
  commands:
  - git config --global --add safe.directory "$${CI_WORKSPACE}"
  - codeql version --format=json | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == "2.27.3"'
  - printf '%s\n' "$CI_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'
  - git init .
  - git remote add origin https://github.com/Perlitten/project-brain-public.git
  - git fetch --tags origin "$CI_COMMIT_SHA"
  - git checkout --detach "$CI_COMMIT_SHA"
  pull: false
- name: codeql-javascript
  image: localhost/woodpecker-codeql@sha256:55926369f574f467df1435391e5995addf658bda06ff1eb9c5722676cef54209
  environment:
    CODEQL_LANGUAGE: javascript-typescript
  commands:
  - git config --global --add safe.directory "$${CI_WORKSPACE}"
  - codeql version --format=json | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == "2.27.3"'
  - bash scripts/ci/codeql.sh
  pull: false
- name: publish-code-scanning
  image: localhost/woodpecker-codeql@sha256:55926369f574f467df1435391e5995addf658bda06ff1eb9c5722676cef54209
  environment:
    GITHUB_TOKEN:
      from_secret: github_code_scanning_token
    CODEQL_LANGUAGE: javascript-typescript
  commands:
  - git config --global --add safe.directory "$${CI_WORKSPACE}"
  - codeql version --format=json | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == "2.27.3"'
  - codeql github upload-results --repository="$CI_REPO" --ref="$CI_COMMIT_REF" --commit="$CI_COMMIT_SHA" --sarif="artifacts/codeql/$CODEQL_LANGUAGE/results.sarif"
  when:
  - event: push
    branch: main
  pull: false
- name: artifacts
  image: woodpeckerci/plugin-s3@sha256:bf0a088e66b991803e3b9b0401f616245c4d736674195204a7e9e343a871a9ea
  settings:
    bucket:
      from_secret: ci_artifact_bucket
    endpoint:
      from_secret: ci_artifact_endpoint
    access_key:
      from_secret: ci_artifact_access_key
    secret_key:
      from_secret: ci_artifact_secret_key
    source: artifacts/codeql/**/*.sarif
    target: codeql/${CI_PIPELINE_NUMBER}/javascript
    path_style: true
    access: private
    region: us-east-1
  when:
  - status:
    - success
    - failure
labels:
  platform: linux/amd64
  backend: docker
  capability: linux
skip_clone: true
