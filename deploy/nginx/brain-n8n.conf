# Project Brain - n8n editor reverse proxy.
# Replace n8n.brain.example.com with N8N_HOST from .env before installing.
# TLS: run certbot for THIS subdomain too (n8n uses N8N_SECURE_COOKIE=true, so
# the editor/session cookie requires HTTPS):
#   sudo certbot --nginx -d n8n.brain.example.com --redirect
# Protect the editor with Basic Auth. Keep production webhook routes unauthenticated
# so external systems can trigger workflows; workflow internals still call Brain
# API with PROJECT_BRAIN_API_KEY.
#   sudo htpasswd -c /etc/nginx/.htpasswd-brain brain
#
# Per-IP rate limit so the public webhook endpoints can't be hammered.
limit_req_zone $binary_remote_addr zone=brain_n8n_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name n8n.brain.example.com;
    error_page 401 = @brain_n8n_auth_required;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location ^~ /webhook/ {
        limit_req zone=brain_n8n_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 8m;
    }

    location ^~ /webhook-test/ {
        limit_req zone=brain_n8n_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 8m;
    }

    location / {
        auth_basic Project-Brain-n8n-20260705;
        auth_basic_user_file /etc/nginx/.htpasswd-brain;
        limit_req zone=brain_n8n_rl burst=20 nodelay;
        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Webhook JSON payloads are small; cap the body to limit abuse surface.
        client_max_body_size 8m;
    }

    location @brain_n8n_auth_required {
        internal;
        default_type text/html;
        return 401 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Brain n8n - Access Required</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a11;color:#e8f1f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(520px,calc(100vw - 32px));border:1px solid rgba(126,196,205,.18);border-radius:16px;background:rgba(16,23,38,.76);padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.eyebrow{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:#2fe3c8;margin-bottom:12px}h1{font-size:28px;line-height:1.1;margin:0 0 10px}p{color:#8ba0a6;line-height:1.55;margin:0 0 18px}.hint{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#5b6f76}</style></head><body><main class="card"><div class="eyebrow">Project Brain</div><h1>n8n access required</h1><p>The workflow editor is protected. Reload the page and enter the Project Brain dashboard credentials.</p><div class="hint">Webhook routes remain available for integrations.</div></main></body></html>';
    }
}
