# Project Brain - nginx reverse proxy.
# Replace brain.example.com with BRAIN_PUBLIC_HOST from .env before installing.
# Upstream: 127.0.0.1:8010 (brain-api container, loopback-published).
#
# Install:
#   sudo cp deploy/nginx/brain.conf /etc/nginx/sites-available/brain.conf
#   sudo ln -sf /etc/nginx/sites-available/brain.conf /etc/nginx/sites-enabled/brain.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d brain.example.com --redirect
# (certbot rewrites this file to add the 443 server + redirect.)
#
# The human UI is the separately deployed web app (apps/web); this host serves
# the JSON API only. /dashboard* is answered by the API itself (redirect to
# BRAIN_WEB_URL, or 404). POST /webhooks/git-merge is token-authenticated by the API.

upstream brain_api {
    server 127.0.0.1:8010;
    keepalive 16;
}

# Per-IP request rate limit. LLM-backed routes (/ask,/context,/impact) hold a
# connection for ~90s, so a few abusive clients could otherwise saturate the
# 1 GiB API container. burst absorbs normal bursts; excess gets 503.
limit_req_zone $binary_remote_addr zone=brain_api_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name brain.example.com;
    # Branded fallback when the API container is down (502/504) or the rate
    # limiter sheds load (503). Without it nginx serves its default grey page.
    error_page 502 503 504 /__brain_errors/unavailable.html;
    location = /__brain_errors/unavailable.html {
        internal;
        alias /opt/project-brain/deploy/nginx/errors/brain_unavailable.html;
    }

    # Let certbot place its challenge here, then add TLS + redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is added by certbot's TLS block; kept here as a fallback for direct access.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=brain_api_rl burst=20 nodelay;
        proxy_pass http://brain_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        # Exact-match wins over `location /`, so it needs its own limit - each
        # /health hit opens a PG/Redis/Neo4j probe, an easy pool-exhaustion vector.
        limit_req zone=brain_api_rl burst=5 nodelay;
        proxy_pass http://brain_api/health;
        access_log off;
    }
}
