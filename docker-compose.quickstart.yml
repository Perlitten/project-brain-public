# Experimental image topology — NOT a supported public installation.
# Public image pulls and a complete published-image install are unverified.
# Use README's source quickstart. No tag or credential defaults are supplied.
# Select a reviewed BRAIN_IMAGE_TAG and set POSTGRES_PASSWORD, NEO4J_PASSWORD,
# PROJECT_BRAIN_API_KEY and WEB_BASIC_AUTH before explicitly testing this file.
# https://github.com/Perlitten/project-brain-public
name: project-brain-quickstart

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: brain
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brain"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.12-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/perlitten/project-brain-api:${BRAIN_IMAGE_TAG:?Select an explicitly reviewed image tag}
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment: &brain-environment
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      PROJECT_BRAIN_API_KEY: ${PROJECT_BRAIN_API_KEY:?Set a random PROJECT_BRAIN_API_KEY}
      DEFAULT_LLM_PROVIDER: mock
      DEFAULT_EMBEDDING_PROVIDER: mock
      REPO_ROOT: /app
      TARGET_REPO_PATH: /app
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); assert all(v['status']=='healthy' for v in d['details'].values())"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  worker:
    image: ghcr.io/perlitten/project-brain-worker:${BRAIN_IMAGE_TAG:?Select an explicitly reviewed image tag}
    depends_on:
      api: {condition: service_healthy}
    command: ["python", "-m", "brain.workers.worker"]
    environment: *brain-environment

  web:
    image: ghcr.io/perlitten/project-brain-web:${BRAIN_IMAGE_TAG:?Select an explicitly reviewed image tag}
    depends_on:
      api: {condition: service_healthy}
    environment:
      BRAIN_API_URL: http://api:8000
      BRAIN_API_KEY: ${PROJECT_BRAIN_API_KEY:?Set a random PROJECT_BRAIN_API_KEY}
      WEB_BASIC_AUTH: ${WEB_BASIC_AUTH:?Set user:password for dashboard sign-in}
    ports: ["127.0.0.1:3100:3100"]

volumes:
  pgdata:
  neo4jdata:
