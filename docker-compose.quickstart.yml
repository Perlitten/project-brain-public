# Quickstart on pre-built GHCR images — no clone, no venv.
#   curl -fsSL https://raw.githubusercontent.com/Perlitten/project-brain/main/docker-compose.quickstart.yml -o docker-compose.yml
#   docker compose up -d
# Available after the first tagged release builds ghcr.io/perlitten/project-brain-* images.
name: project-brain-quickstart

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain-local}
      POSTGRES_DB: brain
    volumes: [pgdata:/var/lib/postgresql/data]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/brain-local}
    volumes: [neo4jdata:/data]

  redis:
    image: redis:7-alpine

  api:
    image: ghcr.io/perlitten/project-brain-api:latest
    depends_on: [postgres, neo4j, redis]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-brain-local}@postgres:5432/brain
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/brain-local}
      REDIS_URL: redis://redis:6379/0
      PROJECT_BRAIN_API_KEY: ${PROJECT_BRAIN_API_KEY:-change-me}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    ports: ["127.0.0.1:8000:8000"]

  worker:
    image: ghcr.io/perlitten/project-brain-worker:latest
    depends_on: [api]
    command: ["python", "-m", "brain.workers.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-brain-local}@postgres:5432/brain
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/brain-local}
      REDIS_URL: redis://redis:6379/0
      PROJECT_BRAIN_API_KEY: ${PROJECT_BRAIN_API_KEY:-change-me}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}

  web:
    image: ghcr.io/perlitten/project-brain-web:latest
    depends_on: [api]
    environment:
      BRAIN_API_URL: http://api:8000
      BRAIN_API_KEY: ${PROJECT_BRAIN_API_KEY:-change-me}
    ports: ["127.0.0.1:3100:3100"]

volumes:
  pgdata:
  neo4jdata:
