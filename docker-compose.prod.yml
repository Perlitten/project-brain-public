# Project Brain - production self-hosted stack.
# Hardened vs docker-compose.yml:
#   - internal datastores (postgres/redis/neo4j) are NOT published to the host
#     (reachable only inside the compose network) - avoids port conflicts with
#     the existing services on the box and removes external attack surface.
#   - API binds to 127.0.0.1:${BRAIN_API_PORT} only; nginx terminates TLS in front.
#   - all secrets come from .env (no hardcoded passwords).
#   - per-service memory limits so brain is a good neighbour on the shared host.
#   - n8n is part of the prod core, loopback-published behind nginx TLS, and
#     healthchecked so orchestration failures are visible in compose status.
#
# Usage:  bash deploy/server_up.sh
name: brain

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: brain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brain_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "hnsw.ef_search=80"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brain_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 8g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: brain-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  neo4j:
    image: neo4j:5.12-community
    container_name: brain-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        BRAIN_BUILD_SHA: ${BRAIN_BUILD_SHA:?BRAIN_BUILD_SHA must be set for production}
        BRAIN_BUILD_TIME: ${BRAIN_BUILD_TIME:-unknown}
        BRAIN_SOURCE_DIGEST: ${BRAIN_SOURCE_DIGEST:?BRAIN_SOURCE_DIGEST must be set for production}
        BRAIN_DEPLOY_DIGEST: ${BRAIN_DEPLOY_DIGEST:?BRAIN_DEPLOY_DIGEST must be set for production}
        BRAIN_REQUIRE_RELEASE_IDENTITY: "true"
    image: brain-api:${BRAIN_IMAGE_TAG:-latest}
    container_name: brain-api
    # Bind to loopback only; nginx reverse-proxies with TLS.
    ports:
      - "127.0.0.1:${BRAIN_API_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brain_db}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      N8N_BASE_URL: http://n8n:5678
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:?N8N_PUBLIC_URL must be set}
      N8N_API_KEY: ${N8N_API_KEY:-}
      REPO_ROOT: /app
      CONTEXT_PACK_OUTPUT_DIR: /app/context_packs
      REPORT_OUTPUT_DIR: /app/reports
      ENVIRONMENT: production
    volumes:
      - ./reports:/app/reports
      - ./context_packs:/app/context_packs
      - ${BRAIN_INDEXED_PROJECTS_DIR:-./indexed-projects}:/indexed:ro
      - ${BRAIN_TARGET_REPO_DIR:-./target-repo}:/repo:ro
      - ${BRAIN_NOSTIA_DIR:-./repos/nostia}:/repos/nostia:ro
      - ${BRAIN_NOSTIA_VAULT_DIR:-./repos/nostia-vault}:/repos/nostia-vault:ro
      - ${BRAIN_NOSTIA_MEMORY_DIR:-./repos/nostia-memory}:/repos/nostia-memory:ro
      - ${BRAIN_NOSTIA_SITE_DIR:-./repos/nostia-site}:/repos/nostia-site:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        BRAIN_BUILD_SHA: ${BRAIN_BUILD_SHA:?BRAIN_BUILD_SHA must be set for production}
        BRAIN_BUILD_TIME: ${BRAIN_BUILD_TIME:-unknown}
        BRAIN_SOURCE_DIGEST: ${BRAIN_SOURCE_DIGEST:?BRAIN_SOURCE_DIGEST must be set for production}
        BRAIN_DEPLOY_DIGEST: ${BRAIN_DEPLOY_DIGEST:?BRAIN_DEPLOY_DIGEST must be set for production}
        BRAIN_REQUIRE_RELEASE_IDENTITY: "true"
    image: brain-api:${BRAIN_IMAGE_TAG:-latest}
    container_name: brain-worker
    command: python -m brain.workers.worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brain_db}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      N8N_BASE_URL: http://n8n:5678
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:?N8N_PUBLIC_URL must be set}
      N8N_API_KEY: ${N8N_API_KEY:-}
      REPO_ROOT: /app
      CONTEXT_PACK_OUTPUT_DIR: /app/context_packs
      REPORT_OUTPUT_DIR: /app/reports
      ENVIRONMENT: production
      WORKER_POOL_NAME: ${WORKER_POOL_NAME:-maintenance}
    volumes:
      - ./reports:/app/reports
      - ./context_packs:/app/context_packs
      - ${BRAIN_INDEXED_PROJECTS_DIR:-./indexed-projects}:/indexed:ro
      - ${BRAIN_TARGET_REPO_DIR:-./target-repo}:/repo:ro
      - ${BRAIN_NOSTIA_DIR:-./repos/nostia}:/repos/nostia:ro
      - ${BRAIN_NOSTIA_VAULT_DIR:-./repos/nostia-vault}:/repos/nostia-vault:ro
      - ${BRAIN_NOSTIA_MEMORY_DIR:-./repos/nostia-memory}:/repos/nostia-memory:ro
      - ${BRAIN_NOSTIA_SITE_DIR:-./repos/nostia-site}:/repos/nostia-site:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; p=os.environ.get('WORKER_REDIS_PREFIX','brain:worker'); enabled=os.environ.get('BRAIN_WORKER_POOLS_V2_ENABLED','false').lower() in ('1','true','yes','on'); p=p+':'+os.environ.get('WORKER_POOL_NAME','maintenance') if enabled else p; r=redis.from_url(os.environ['REDIS_URL']); raise SystemExit(0 if r.get(p+':heartbeat') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  worker-fast:
    extends:
      service: worker
    container_name: brain-worker-fast
    profiles: ["worker-pools-v2"]
    environment:
      WORKER_POOL_NAME: fast
    mem_limit: 512m

  worker-deep:
    extends:
      service: worker
    container_name: brain-worker-deep
    profiles: ["worker-pools-v2"]
    environment:
      WORKER_POOL_NAME: deep
    mem_limit: 1g

  n8n:
    # Pinned (not :latest) so a rebuild/pull can't silently upgrade n8n in prod.
    image: n8nio/n8n:2.27.4
    container_name: brain-n8n
    # Loopback only; nginx reverse-proxies the UI with TLS.
    ports:
      - "127.0.0.1:${BRAIN_N8N_PORT:-5680}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:?N8N_HOST must be set}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:?N8N_PUBLIC_URL must be set}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:?N8N_PUBLIC_URL must be set}
      GENERIC_TIMEZONE: UTC
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Canonical workflows read the API key and webhook token through $env.
      # The editor is separately protected and only Git-tracked workflows are
      # published, so enable the expression access explicitly for this stack.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # nginx terminates TLS and forwards X-Forwarded-Proto: https, so secure
      # cookies are correct here and keep the session cookie off plaintext.
      N8N_SECURE_COOKIE: "true"
      # n8n internal queue/cache - separate Redis DB from brain worker (db 0).
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: 2
      PROJECT_BRAIN_API_URL: http://api:8000
      PROJECT_BRAIN_API_KEY: ${PROJECT_BRAIN_API_KEY}
      PROJECT_BRAIN_WEBHOOK_TOKEN: ${PROJECT_BRAIN_WEBHOOK_TOKEN:?PROJECT_BRAIN_WEBHOOK_TOKEN must be set}
      PROJECT_BRAIN_GIT_REPO_PATH: ${PROJECT_BRAIN_GIT_REPO_PATH:-/app}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/import/workflows:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  n8n_data:
