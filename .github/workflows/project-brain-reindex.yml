name: Project Brain Reindex

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: project-brain-reindex
  cancel-in-progress: true

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enqueue durable Project Brain reindex
        env:
          PROJECT_BRAIN_WEBHOOK_TOKEN: ${{ secrets.PROJECT_BRAIN_WEBHOOK_TOKEN }}
          PROJECT_BRAIN_WEBHOOK_URL: ${{ vars.PROJECT_BRAIN_WEBHOOK_URL }}
        run: |
          test -n "$PROJECT_BRAIN_WEBHOOK_TOKEN"
          test -n "$PROJECT_BRAIN_WEBHOOK_URL"
          body="{\"ref\":\"refs/heads/master\",\"sha\":\"${GITHUB_SHA}\"}"
          signature="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$PROJECT_BRAIN_WEBHOOK_TOKEN" -r | awk '{print $1}')"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 45 \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data "$body" \
            "$PROJECT_BRAIN_WEBHOOK_URL"
