name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must match a pushed v* tag)"
        required: true

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python scripts/check_release_archives.py dist/*.whl dist/*.tar.gz
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: worker
            context: .
            dockerfile: Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/perlitten/project-brain-${{ matrix.name }}:${{ env.RELEASE_TAG }}
            ghcr.io/perlitten/project-brain-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  github-release:
    needs: [dist, images, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
      - name: Verify distributions and checksum every release asset
        run: |
          python scripts/check_release_archives.py dist/*.whl dist/*.tar.gz
          python - <<'PY'
          import hashlib, pathlib
          paths = sorted(pathlib.Path('dist').glob('*.whl')) + sorted(pathlib.Path('dist').glob('*.tar.gz')) + [pathlib.Path('sbom/sbom.spdx.json')]
          pathlib.Path('SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in paths))
          PY
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          ver = tag.lstrip('v')
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"## \[?{re.escape(ver)}\]?.*?(?=\n## |\Z)", text, re.S)
          notes = m.group(0).strip().split('\n', 1)[1] if m else '\nSee CHANGELOG.md.'
          launch = re.search(r'## \[Unreleased\]\n(.*?)(?=\n## |\Z)', text, re.S)
          if ver == '0.9.1' and launch and '### Launch remediation' in launch.group(1):
              notes = launch.group(1).strip() + '\n\n' + notes.strip()
          pathlib.Path("release-notes.md").write_text(f"## {tag}\n\n{notes.strip()}\n")
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom/sbom.spdx.json
            SHA256SUMS
