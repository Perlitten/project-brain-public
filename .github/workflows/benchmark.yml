name: Harness benchmark

# Measures whether Project Brain actually helps development, against
# human-curated ground truth (eval/harness_benchmark/).
#
# Runs weekly + on demand. Does NOT block merges: the benchmark is a
# signal, not a gate, until the mock-provider scores are calibrated.
# Hard errors (task crashes) fail the run; score regressions are reported
# as annotations for now.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: <redacted>
          POSTGRES_DB: brain_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5.12-community
        env:
          NEO4J_AUTH: neo4j/neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: <redacted>
      POSTGRES_DB: brain_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: <redacted>
      DEFAULT_LLM_PROVIDER: mock
      DEFAULT_EMBEDDING_PROVIDER: mock
      EMBEDDING_DIMENSION: 1536
      TARGET_REPO_PATH: .
      REPO_ROOT: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Run migrations
        run: python scripts/check_migrations.py

      - name: Start API
        run: |
          nohup python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/brain-api.log 2>&1 &
          echo $! > /tmp/brain-api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "API is up"
              break
            fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8000/health || (cat /tmp/brain-api.log && exit 1)

      - name: Index repository
        run: |
          curl -sf -X POST http://127.0.0.1:8000/index \
            -H "Content-Type: application/json" \
            -d '{"repo_path": ".", "clean": true}' | head -c 500
          echo
          for i in $(seq 1 60); do
            STATUS=$(curl -s http://127.0.0.1:8000/index/runs \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['recent_runs'][0]['status'])" 2>/dev/null)
            echo "  poll $i: $STATUS"
            if [ "$STATUS" = "completed" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then echo "indexing failed"; exit 1; fi
            sleep 20
          done

      - name: Run harness benchmark
        run: |
          mkdir -p eval/harness_benchmark/results
          python eval/harness_benchmark/run.py \
            --api-url http://127.0.0.1:8000 \
            --repo "$PWD" \
            --skip-review \
            --output eval/harness_benchmark/results/benchmark_ci.json 2>&1 | tail -30

      - name: Regression gate
        run: |
          python eval/harness_benchmark/ci_gate.py \
            --results eval/harness_benchmark/results/benchmark_ci.json \
            --baseline eval/harness_benchmark/baseline.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: eval/harness_benchmark/results/benchmark_ci.json
          retention-days: 90
