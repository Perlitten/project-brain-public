name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: brain_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5.12-community
        env:
          NEO4J_AUTH: neo4j/neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: brain_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      DEFAULT_LLM_PROVIDER: mock
      DEFAULT_EMBEDDING_PROVIDER: mock
      TARGET_REPO_PATH: .
      REPO_ROOT: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint with ruff
        run: ruff check brain apps tests

      - name: Type check ratchet (mypy, non-increasing baseline)
        run: bash scripts/mypy_gate.sh

      - name: Migration check (fresh init + idempotent re-apply)
        run: python scripts/check_migrations.py

      - name: Run tests
        run: pytest -q

      - name: Reject stale deployment identities
        run: bash deploy/doctor.sh stale-scan

      - name: Build wheel + clean-install smoke
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist/
          python -m venv /tmp/whlvenv
          /tmp/whlvenv/bin/pip install --require-hashes -r requirements.lock
          /tmp/whlvenv/bin/pip install --no-deps dist/*.whl
          /tmp/whlvenv/bin/brain --help >/dev/null
          echo "wheel installs and 'brain --help' entrypoint works"
