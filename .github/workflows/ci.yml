name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hash-locked dependencies
        run: python scripts/run_lite_ci.py --install
      - name: Zero-service SQLite acceptance
        run: python scripts/run_lite_ci.py

  public-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify public commit identity and messages
        run: python scripts/check_public_privacy.py --allow-github-identities
      - name: Verify public launch links
        run: python scripts/check_public_launch.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:production

  container-real-docker:
    # The bounded executor's container backend against a real Docker daemon (pytest -m real_docker): step
    # isolation, egress proxy denial on an --internal network, and git inside the environment image. The images
    # are built from tests/docker/execution.Dockerfile; the tests contact no outside host, and
    # BRAIN_TEST_REQUIRE_DOCKER=1 turns any skip into a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Build the execution test images
        run: |
          docker build -f tests/docker/execution.Dockerfile --target environment -t brain-exec-test-env .
          docker build -f tests/docker/execution.Dockerfile --target egress-proxy -t brain-exec-test-proxy .

      - name: Real-docker execution tests
        timeout-minutes: 8
        env:
          BRAIN_TEST_EXECUTION_IMAGE: brain-exec-test-env
          BRAIN_TEST_EGRESS_PROXY_IMAGE: brain-exec-test-proxy
          BRAIN_TEST_REQUIRE_DOCKER: "1"
        run: pytest tests/test_team_execution_container.py -m real_docker -v -p no:cacheprovider

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: brain_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5.12-community
        env:
          NEO4J_AUTH: neo4j/neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: brain_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      DEFAULT_LLM_PROVIDER: mock
      DEFAULT_EMBEDDING_PROVIDER: mock
      TARGET_REPO_PATH: .
      REPO_ROOT: .

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint with ruff
        run: ruff check .

      - name: Verify legal inventory against pinned dependencies
        run: python scripts/check_third_party_notices.py

      - name: Type check ratchet (mypy, non-increasing baseline)
        run: bash scripts/mypy_gate.sh

      - name: Migration check (fresh init + idempotent re-apply)
        run: python scripts/check_migrations.py

      - name: Run tests (with coverage)
        run: pytest -q --cov=brain --cov=apps --cov-report=term-missing --cov-report=xml:coverage.xml
        env:
          # Optional comma/newline-separated extra banned phrases (repo secret),
          # hashed on the fly by the privacy denylist test. Empty is fine.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Team authority PostgreSQL race, native MCP and restore checks
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE USER fixture WITH CREATEDB PASSWORD 'fixture_local_only'" \
            -c "CREATE DATABASE brain_team_test OWNER fixture"
          TEST_TEAM_POSTGRES_URL="postgresql+asyncpg://fixture:fixture_local_only@127.0.0.1:$POSTGRES_PORT/brain_team_test" \
            pytest tests/test_team_foundations.py tests/test_team_transport.py tests/test_team_restore.py \
            tests/test_team_invitations.py tests/test_team_restore_fence.py tests/test_team_execution.py \
            tests/test_team_lock_order.py tests/test_team_execution_llm_artifacts.py tests/test_memory_cas_concurrency.py -q

      - name: Coverage summary
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate'])*100))")
          echo "### Test coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "coverage_pct=$COVERAGE" >> "$GITHUB_OUTPUT"
        id: coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Build wheel + clean-install smoke
        run: |
          python -m pip install build
          python -m build --wheel --sdist --outdir dist/
          python scripts/check_third_party_notices.py dist/*.whl dist/*.tar.gz
          python -m venv /tmp/whlvenv
          /tmp/whlvenv/bin/pip install --require-hashes -r requirements.lock
          /tmp/whlvenv/bin/pip install --no-deps dist/*.whl
          /tmp/whlvenv/bin/brain --help >/dev/null
          echo "wheel installs and 'brain --help' entrypoint works"
