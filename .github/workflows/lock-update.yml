name: Dependency lock update

# Regenerates requirements*.lock from pyproject.toml and opens a PR.
# Manual dispatch for on-demand bumps; weekly schedule keeps pins fresh.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate lockfiles
        run: |
          python -m pip install --upgrade pip pip-tools
          PYTHON=python bash scripts/regen_locks.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B deps/lock-update
          git add requirements.lock requirements-dev.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): regenerate hashed requirements locks"
          git push -f origin deps/lock-update

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view deps/lock-update --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "${{ github.event.repository.default_branch }}" --head deps/lock-update \
              --title "chore(deps): regenerate hashed requirements locks" \
              --body "Automated regeneration of requirements.lock and requirements-dev.lock via scripts/regen_locks.sh (pip-compile --generate-hashes)."
